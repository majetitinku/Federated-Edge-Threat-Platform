name: Federated Edge Threat Platform CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall .

      - name: Verify imports
        run: |
          python -c "import aws"
          python -c "import dashboard"
          python -c "import database"
          python -c "import edge_node"
          python -c "import fog_node"
          python -c "import sensor_simulator"

      - name: Initialize database
        run: python database/init_db.py

      - name: Verify Isolation Forest model
        run: python edge_node/train_model.py

      - name: Verify Dashboard
        run: python -c "from dashboard.app import *"

      - name: CI completed
        run: echo "Pipeline completed successfully."
